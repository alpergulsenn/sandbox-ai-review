## 5. Memory Leak Patterns - CRITICAL

### MANDATORY CHECK: Event Listeners
```javascript
// ❌ CRITICAL: Missing cleanup in useEffect
useEffect(() => {
  window.addEventListener('resize', handleResize);
  // Missing return cleanup!
}, []);

// ❌ CRITICAL: Timer not cleared
useEffect(() => {
  const timer = setInterval(() => fetchData(), 1000);
  // Missing clearInterval!
}, []);
```

### Required Fix:
```javascript
// ✅ ALWAYS cleanup listeners
useEffect(() => {
  const handleResize = () => { /* ... */ };
  window.addEventListener('resize', handleResize);
  
  return () => window.removeEventListener('resize', handleResize);
}, []);

// ✅ ALWAYS clear timers
useEffect(() => {
  const timer = setInterval(() => fetchData(), 1000);
  
  return () => clearInterval(timer);
}, []);
```

### Review Actions:
- **MANDATORY**: Check EVERY useEffect has cleanup if it:
  - Adds event listeners (addEventListener)
  - Creates timers (setInterval, setTimeout)
  - Opens connections (WebSocket, EventSource)
  - Subscribes to observables
- Flag detached DOM nodes with listeners
- Check closures don't capture large objects unnecessarily

---

## 6. Performance Anti-Patterns - HIGH

### N+1 Query Problem:
```javascript
// ❌ CRITICAL: 100 users = 100 API calls
function UserList({ userIds }) {
  return userIds.map(id => <UserCard userId={id} />);
}

function UserCard({ userId }) {
  const user = useQuery(['user', userId], () => fetchUser(userId));
  // Makes separate request per card!
}
```

### Required Fix:
```javascript
// ✅ Batch request
function UserList({ userIds }) {
  const users = useQuery(['users', userIds], () => 
    fetchUsersBatch(userIds) // Single request
  );
  return users.data?.map(user => <UserCard user={user} />);
}
```

### Unnecessary Re-renders:
```javascript
// ❌ HIGH: Object created every render
function Parent() {
  const config = { theme: 'dark' }; // New object each time
  const handleClick = () => console.log('hi'); // New function each time
  
  return <Child config={config} onClick={handleClick} />;
  // Child re-renders unnecessarily
}
```

### Required Fix:
```javascript
// ✅ Memoize objects and functions
function Parent() {
  const config = useMemo(() => ({ theme: 'dark' }), []);
  const handleClick = useCallback(() => console.log('hi'), []);
  
  return <Child config={config} onClick={handleClick} />;
}
```

### Review Actions:
- Flag API calls inside map/loops (N+1 problem)
- Flag multiple sequential filter/map chains (use reduce)
- Check for object/function definitions inside render
- Verify expensive computations use useMemo

---

## 7. Bundle Size Impact - MEDIUM

### Dangerous Patterns:
```javascript
// ❌ HIGH: Importing entire library
import _ from 'lodash'; // 70KB
import moment from 'moment'; // 290KB
import * as MUI from '@mui/material'; // 500KB+

// ❌ MEDIUM: No code splitting
import Dashboard from './Dashboard'; // 2MB loaded upfront
```

### Required Fix:
```javascript
// ✅ Import specific functions
import debounce from 'lodash/debounce'; // 2KB
import { format } from 'date-fns'; // Tree-shakeable
import { Button, TextField } from '@mui/material';

// ✅ Lazy load heavy components
const Dashboard = lazy(() => import('./Dashboard'));

function App() {
  return (
    <Suspense fallback={<Spinner />}>
      <Dashboard />
    </Suspense>
  );
}
```

