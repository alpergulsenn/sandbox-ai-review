## 4. Path Traversal - HIGH

### Dangerous Patterns:
```csharp
// ❌ CRITICAL: User-controlled file path
[HttpGet("download/{fileName}")]
public IActionResult Download(string fileName)
{
    var path = Path.Combine(_uploadPath, fileName);
    return PhysicalFile(path, "application/octet-stream");
    // Attacker: "../../etc/passwd"
}
```

### Required Fix:
```csharp
// ✅ Sanitize path
[HttpGet("download/{fileName}")]
public IActionResult Download(string fileName)
{
    var safeName = Path.GetFileName(fileName); // Remove ".."
    var path = Path.Combine(_uploadPath, safeName);
    
    var fullPath = Path.GetFullPath(path);
    if (!fullPath.StartsWith(_uploadPath))
        return BadRequest("Invalid path");
    
    return PhysicalFile(fullPath, "application/octet-stream");
}
```

# ═══════════════════════════════════════════════════════════
# ⚡ ASYNC/AWAIT PATTERNS & DEADLOCKS
# ═══════════════════════════════════════════════════════════

## 5. Async-over-Sync Deadlocks - CRITICAL

### Dangerous Patterns:
```csharp
// ❌ CRITICAL: .Result causes deadlock in ASP.NET
public void ProcessOrder(int orderId)
{
    var order = GetOrderAsync(orderId).Result; // DEADLOCK!
}

// ❌ CRITICAL: .Wait() same problem
public void SaveUser(User user)
{
    SaveUserAsync(user).Wait(); // DEADLOCK!
}

// ❌ HIGH: async void (exceptions lost)
private async void LoadData()
{
    var data = await FetchDataAsync();
    // Exception here is unobservable
}

// ❌ HIGH: Task.Run wrapping non-I/O
public async Task<int> Calculate(List<int> numbers)
{
    return await Task.Run(() => numbers.Sum());
    // Wastes thread pool
}

// ❌ CRITICAL: Missing ConfigureAwait in library
public async Task<User> GetUserAsync(int id)
{
    var response = await _httpClient.GetAsync($"/api/users/{id}");
    // Should use ConfigureAwait(false) in libraries
}
```

### Required Fix:
```csharp
// ✅ Make caller async
public async Task ProcessOrderAsync(int orderId)
{
    var order = await GetOrderAsync(orderId);
}

// ✅ async Task (not void)
private async Task LoadDataAsync()
{
    try
    {
        var data = await FetchDataAsync();
    }
    catch (Exception ex)
    {
        _logger.LogError(ex, "Failed");
    }
}

// ✅ Don't wrap CPU work
public int Calculate(List<int> numbers)
{
    return numbers.Sum(); // Synchronous
}

// ✅ ConfigureAwait(false) in libraries
public async Task<User> GetUserAsync(int id)
{
    var response = await _httpClient
        .GetAsync($"/api/users/{id}")
        .ConfigureAwait(false);
}
```

### Review Actions:
- **CRITICAL**: Flag ALL .Result, .Wait(), .GetAwaiter().GetResult()
- Flag async void (except event handlers)
- Flag Task.Run wrapping CPU-only operations
- Check library code uses ConfigureAwait(false)

---

## 6. Async Performance - HIGH

### Sequential When Should Be Parallel:
```csharp
// ❌ HIGH: Sequential awaits (650ms total)
public async Task<UserProfile> LoadProfile(int userId)
{
    var user = await GetUserAsync(userId);      // 200ms
    var orders = await GetOrdersAsync(userId);   // 300ms
    var prefs = await GetPrefsAsync(userId);     // 150ms
    return new UserProfile(user, orders, prefs);
}

// ❌ MEDIUM: Awaiting in loop
public async Task<List<User>> LoadUsers(List<int> ids)
{
    var users = new List<User>();
    foreach (var id in ids)
    {
        var user = await GetUserAsync(id); // 100 * 200ms = 20s!
        users.Add(user);
    }
    return users;
}
```

### Required Fix:
```csharp
// ✅ Parallel (300ms total)
public async Task<UserProfile> LoadProfile(int userId)
{
    var userTask = GetUserAsync(userId);
    var ordersTask = GetOrdersAsync(userId);
    var prefsTask = GetPrefsAsync(userId);
    
    await Task.WhenAll(userTask, ordersTask, prefsTask);
    
    return new UserProfile(
        userTask.Result,
        ordersTask.Result,
        prefsTask.Result
    );
}

// ✅ Batch parallel
public async Task<List<User>> LoadUsers(List<int> ids)
{
    var tasks = ids.Select(id => GetUserAsync(id));
    return (await Task.WhenAll(tasks)).ToList();
}
```

# ═══════════════════════════════════════════════════════════
# 🗄️ ENTITY FRAMEWORK CORE PERFORMANCE
# ═══════════════════════════════════════════════════════════

## 7. N+1 Query Problem - CRITICAL

### Dangerous Patterns:
```csharp
// ❌ CRITICAL: 100 users = 101 queries
public async Task<List<UserDto>> GetUsers()
{
    var users = await _context.Users.ToListAsync(); // 1 query
    
    var result = new List<UserDto>();
    foreach (var user in users)
    {
        var orders = await _context.Orders
            .Where(o => o.UserId == user.Id)
            .ToListAsync(); // 100 queries!
        
        result.Add(new UserDto
        {
            Name = user.Name,
            OrderCount = orders.Count
        });
    }
    return result;
}

// ❌ CRITICAL: Lazy loading in loop
public async Task<List<Order>> GetOrders()
{
    var orders = await _context.Orders.ToListAsync();
    foreach (var order in orders)
    {
        var count = order.Items.Count; // Separate query!
    }
    return orders;
}

// ❌ HIGH: Missing AsNoTracking
public async Task<List<User>> GetAllUsers()
{
    return await _context.Users.ToListAsync();
    // Tracking overhead for read-only
}
```

### Required Fix:
```csharp
// ✅ Use Include (2 queries total)
public async Task<List<UserDto>> GetUsers()
{
    var users = await _context.Users
        .Include(u => u.Orders)
        .ToListAsync();
    
    return users.Select(u => new UserDto
    {
        Name = u.Name,
        OrderCount = u.Orders.Count
    }).ToList();
}

// ✅ ThenInclude for nested
public async Task<List<Order>> GetOrders()
{
    return await _context.Orders
        .Include(o => o.Items)
        .ThenInclude(i => i.Product)
        .ToListAsync();
}

// ✅ AsNoTracking for read-only
public async Task<List<User>> GetAllUsers()
{
    return await _context.Users
        .AsNoTracking()
        .ToListAsync();
}

// ✅ Project to DTO
public async Task<List<UserDto>> GetUserSummaries()
{
    return await _context.Users
        .AsNoTracking()
        .Select(u => new UserDto
        {
            Id = u.Id,
            Name = u.Name,
            Email = u.Email
        })
        .ToListAsync();
}
```

### Review Actions:
- **CRITICAL**: Check queries inside loops
- Flag lazy loading in loops (add .Include)
- Flag missing AsNoTracking on read-only
- Suggest Select() projection vs full entities

---

## 8. IQueryable vs IEnumerable - HIGH

### Dangerous Patterns:
```csharp
// ❌ HIGH: ToList() too early
public async Task<List<User>> GetActiveUsers()
{
    var allUsers = await _context.Users.ToListAsync(); // ALL users
    
    return allUsers
        .Where(u => u.IsActive) // In-memory filter
        .OrderBy(u => u.Name)
        .Take(10)
        .ToList();
}

// ❌ HIGH: IEnumerable prevents DB filtering
public IEnumerable<Order> GetRecentOrders()
{
    IEnumerable<Order> orders = _context.Orders;
    return orders.Where(o => o.CreatedAt > DateTime.Now.AddDays(-30));
    // Executes in memory!
}

// ❌ CRITICAL: Multiple enumerations
public async Task ProcessOrders()
{
    var orders = _context.Orders.Where(o => o.Status == "Pending");
    
    var count = await orders.CountAsync();  // Query 1
    var total = await orders.SumAsync(o => o.Total); // Query 2
    var list = await orders.ToListAsync();  // Query 3
}
```

### Required Fix:
```csharp
// ✅ Keep IQueryable until final
public async Task<List<User>> GetActiveUsers()
{
    return await _context.Users
        .Where(u => u.IsActive)
        .OrderBy(u => u.Name)
        .Take(10)
        .ToListAsync();
}

// ✅ Use IQueryable
public IQueryable<Order> GetRecentOrders()
{
    return _context.Orders
        .Where(o => o.CreatedAt > DateTime.Now.AddDays(-30));
}

// ✅ Execute once
public async Task ProcessOrders()
{
    var orders = await _context.Orders
        .Where(o => o.Status == "Pending")
        .ToListAsync();
    
    var count = orders.Count;
    var total = orders.Sum(o => o.Total);
}
```

---

## 9. SaveChanges in Loop - CRITICAL

### Dangerous Patterns:
```csharp
// ❌ CRITICAL: 1000 users = 1000 roundtrips
public async Task ImportUsers(List<User> users)
{
    foreach (var user in users)
    {
        _context.Users.Add(user);
        await _context.SaveChangesAsync(); // DB call per user!
    }
}
```

### Required Fix:
```csharp
// ✅ Batch insert
public async Task ImportUsers(List<User> users)
{
    _context.Users.AddRange(users);
    await _context.SaveChangesAsync(); // 1 transaction
}

// ✅ For updates (EF7+)
public async Task UpdateEmails(Dictionary<int, string> updates)
{
    foreach (var (id, email) in updates)
    {
        await _context.Users
            .Where(u => u.Id == id)
            .ExecuteUpdateAsync(s => s.SetProperty(u => u.Email, email));
    }
}
```

