## 1. SQL Injection - CRITICAL

### Dangerous Patterns:
```csharp
// ❌ CRITICAL: String concatenation in SQL
var query = $"SELECT * FROM Users WHERE Email = '{email}'";
_context.Database.SqlQueryRaw<User>(query);

// ❌ CRITICAL: FromSqlRaw with interpolation
_context.Orders.FromSqlRaw($"SELECT * FROM Orders WHERE UserId = '{userId}'");

// ❌ HIGH: Dynamic LINQ with user input
_context.Users.OrderBy(sortColumn); // User controls property
```

### Required Fix:
```csharp
// ✅ Parameterized query
var query = "SELECT * FROM Users WHERE Email = {0}";
_context.Database.SqlQueryRaw<User>(query, email);

// ✅ FromSqlInterpolated (safe)
_context.Orders.FromSqlInterpolated($"SELECT * FROM Orders WHERE UserId = {userId}");

// ✅ Expression-based sorting
return sortColumn switch
{
    "Name" => _context.Users.OrderBy(u => u.Name),
    "Email" => _context.Users.OrderBy(u => u.Email),
    _ => _context.Users.OrderBy(u => u.Id)
};
```

### Review Actions:
- Flag ANY string concatenation in SQL
- Flag FromSqlRaw with $ (use FromSqlInterpolated)
- Check dynamic LINQ has validation
- Verify stored procedures use SqlParameter

---

## 2. Hardcoded Secrets - CRITICAL

### Dangerous Patterns:
```csharp
// ❌ CRITICAL: Hardcoded credentials
public string ConnectionString = "Server=prod;User=admin;Password=Admin123!";
public const string ApiKey = "sk_live_a1b2c3d4e5f6";
public string JwtSecret = "MySecretKey123456789";

// ❌ CRITICAL: Plain text passwords
var user = new User
{
    Username = username,
    Password = password // No hashing!
};
```

### Required Fix:
```csharp
// ✅ Configuration-based secrets
private readonly IConfiguration _config;

public string GetConnectionString() => 
    _config.GetConnectionString("DefaultConnection");

public string GetApiKey() => 
    _config["Azure:ApiKey"];

// ✅ Password hashing
public async Task CreateUser(string username, string password)
{
    var user = new ApplicationUser { UserName = username };
    await _userManager.CreateAsync(user, password); // Hashes automatically
}
```

### Review Actions:
- Search for: Password, ConnectionString, ApiKey, Secret, Token
- Flag plain text password storage
- Check ALL controllers have [Authorize] or [AllowAnonymous]
- Verify sensitive config in appsettings (not code)

