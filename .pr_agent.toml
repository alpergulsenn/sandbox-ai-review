## 4. Data Exposure & Information Leakage - HIGH

### Dangerous Patterns to Flag:
```javascript
// ❌ HIGH: Stack traces in production
app.use((err, req, res, next) => {
  res.status(500).json({ error: err.stack });
});

// ❌ MEDIUM: Logging sensitive data
console.log('User login:', { email, password });
logger.info('Payment:', paymentInfo);

// ❌ HIGH: Sending password hashes
app.get('/api/users', async (req, res) => {
  const users = await User.find(); // Includes passwords!
  res.json(users);
});

// ❌ CRITICAL: CORS wildcard
app.use(cors({ origin: '*' }));
```

### Required Fix:
```javascript
// ✅ Generic errors in production
app.use((err, req, res, next) => {
  if (process.env.NODE_ENV === 'production') {
    res.status(500).json({ error: 'Internal server error' });
  } else {
    res.status(500).json({ error: err.message, stack: err.stack });
  }
});

// ✅ Never log sensitive fields
const { password, ...safeUser } = user;
console.log('User login:', safeUser);

// ✅ Select specific fields
app.get('/api/users', async (req, res) => {
  const users = await User.find().select('name email avatar -_id');
  res.json(users);
});

// ✅ Restrict CORS
app.use(cors({
  origin: ['https://myapp.com'],
  credentials: true
}));
```

