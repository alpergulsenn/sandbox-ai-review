## 3. Server-Side Injection (Node.js) - CRITICAL

### Dangerous Patterns to Flag:
```javascript
// ❌ CRITICAL: SQL Injection
const query = `SELECT * FROM users WHERE email = '${userEmail}'`;
db.execute(query);

// ❌ CRITICAL: Command Injection (RCE)
const { exec } = require('child_process');
exec(`convert ${userFileName}.jpg output.png`);

// ❌ CRITICAL: Path Traversal
const filePath = path.join(__dirname, 'uploads', req.query.filename);
fs.readFileSync(filePath); // User: "../../etc/passwd"

// ❌ HIGH: NoSQL Injection
User.find({ email: req.body.email }); // Attacker: {"$gt": ""}
```

### Required Fix:
```javascript
// ✅ Parameterized queries
const query = 'SELECT * FROM users WHERE email = ?';
db.execute(query, [userEmail]);

// ✅ Use libraries instead of shell
const sharp = require('sharp');
await sharp(userFileName).toFile('output.png');

// ✅ Sanitize file paths
const safeName = path.basename(req.query.filename);
const filePath = path.join(__dirname, 'uploads', safeName);
if (!filePath.startsWith(path.join(__dirname, 'uploads'))) {
  throw new Error('Invalid path');
}

// ✅ Validate NoSQL input
const email = typeof req.body.email === 'string' ? req.body.email : '';
User.find({ email });
```

### Review Actions:
- Flag string concatenation in SQL/database queries
- Flag child_process.exec() with user input
- Check file operations for path traversal
- Verify NoSQL queries sanitize object inputs

