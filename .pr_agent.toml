[config]
enable_custom_labels = true
model = "vertex_ai/gemini-2.0-flash-001"
fallback_models = []
publish_output = true

[pr_reviewer]
publish_output = true
num_code_suggestions = 10
inline_code_comments = true
persistent_comment = true
minimal_severity = "Medium"
require_security_review = true
require_score_review = false
require_tests_review = false
require_estimate_effort_to_review = true
require_can_be_split_review = false
enable_review_labels_effort = true
enable_review_labels_security = false
enable_auto_approval = false

# ═══════════════════════════════════════════════════════════
# 🎯 SYSTEM PROMPT - CORE AI PERSONALITY
# ═══════════════════════════════════════════════════════════
system_prompt = """
IDENTITY: Senior Software Architect and Security Auditor

MISSION: Find 5-8 critical issues in this PR.

LANGUAGE DETECTION:
1. Detect PR language from file extensions (.js, .cs, .java, .py, .go)
2. Apply appropriate rulebook

JAVASCRIPT/TYPESCRIPT RULEBOOK:
Triggers: .js, .jsx, .ts, .tsx, package.json

CRITICAL CHECKS:
1. XSS vulnerabilities (innerHTML, dangerouslySetInnerHTML, eval)
2. Memory leaks (missing cleanup in useEffect)
3. Authentication (JWT in localStorage)
4. Async errors (missing try-catch)
5. React Hooks violations

OUTPUT FORMAT:
## 🔴 CRITICAL Issues

### 1. Security: [Issue Title]
**Problem:** [What's wrong]
**Risk:** [Impact]
**Current Code:**
```language
[bad code]
```
**Required Fix:**
```diff
- [old code]
+ [new code]
```

.NET/C# RULEBOOK:
Triggers: .cs, .csproj

CRITICAL CHECKS:
1. EF Core: Missing AsNoTracking in read queries
2. Async: .Result or .Wait() usage (deadlock risk)
3. DI: Captive dependencies
4. SQL injection in raw queries

JAVA RULEBOOK:
Triggers: .java, pom.xml

CRITICAL CHECKS:
1. Optional.get() without isPresent()
2. @Transactional on private methods
3. N+1 queries (missing @EntityGraph)

COMMUNICATION:
- If PR description is Turkish → Respond in Turkish
- If English → Respond in English
- Keep technical terms in English
"""

extra_instructions = """
MANDATORY RULES:

1. Find EXACTLY 5-8 issues
2. Prioritize by severity: CRITICAL > HIGH > MEDIUM
3. Each issue MUST have:
   - Problem description
   - Code example showing issue
   - Suggested fix with code

FOCUS ON:
- Security vulnerabilities
- Memory leaks
- Performance killers (N+1 queries)
- Logic errors

DO NOT FLAG:
- Linting issues (prettier, eslint)
- Variable naming (unless critical)
- Formatting (spaces, semicolons)

FOR JAVASCRIPT:
Check EVERY useEffect for cleanup:
```javascript
useEffect(() => {
  window.addEventListener('resize', handler);
  return () => window.removeEventListener('resize', handler); // REQUIRED
}, []);
```

FOR .NET:
Check EVERY EF query for AsNoTracking:
```csharp
// ❌ BAD
var users = await _context.Users.ToListAsync();

// ✅ GOOD
var users = await _context.Users.AsNoTracking().ToListAsync();
```

FOR JAVA:
Check Optional usage:
```java
// ❌ BAD
User user = users.stream().findFirst().get();

// ✅ GOOD
User user = users.stream().findFirst().orElseThrow();
```
"""

[pr_code_suggestions]
num_code_suggestions = 5
extra_instructions = """
PROVIDE ARCHITECTURAL REFACTORING:

1. Callback Hell → Async/Await transformation
2. Linear Search → Map/Index optimization
3. Empty Catch → Retry Strategy
4. God Component → Composition

Each suggestion must show:
- Current problematic code
- Refactored version
- Performance impact (quantified)
"""

# --- BOYUT LABEL'LARI ---
[custom_labels."size/XS"]
description = "pr_agent: PR has very minimal changes, fewer than 50 lines changed in total"

[custom_labels."size/S"]
description = "pr_agent: PR has small changes, between 50 and 150 lines changed"

[custom_labels."size/M"]
description = "pr_agent: PR has moderate changes, between 150 and 300 lines changed"

[custom_labels."size/L"]
description = "pr_agent: PR has large changes, between 300 and 700 lines changed"

[custom_labels."size/XL"]
description = "pr_agent: PR has very large changes, more than 700 lines changed"

# --- TÜR LABEL'LARI ---
[custom_labels."Bug-fix"]
description = "pr_agent: PR contains bug fixes or resolves issues. Look for keywords like 'fix', 'bug', 'resolve', 'issue' in the PR description or commit messages"

[custom_labels."Feature"]
description = "pr_agent: PR adds new features or functionality to the codebase"

[custom_labels."Refactoring"]
description = "pr_agent: PR refactors existing code without changing functionality. Look for improved structure, SOLID principles application, or code cleanup"

[custom_labels."security-review"]
description = "pr_agent: PR contains security-related changes, authentication, authorization, encryption, or sensitive data handling. Look for keywords like 'security', 'auth', 'password', 'token', 'encrypt'"

[custom_labels."performance"]
description = "pr_agent: PR improves performance, optimizes algorithms, or reduces resource usage"

[custom_labels."documentation"]
description = "pr_agent: PR mainly updates documentation, comments, or README files"

[custom_labels."tests"]
description = "pr_agent: PR adds or modifies test cases, test coverage, or testing infrastructure"

[custom_labels."database"]
description = "pr_agent: PR contains database schema changes, migrations, or SQL queries"

[custom_labels."api-change"]
description = "pr_agent: PR modifies API endpoints, request/response structures, or breaks backward compatibility"

[custom_labels."dependencies"]
description = "pr_agent: PR updates dependencies, packages, or external libraries"

# --- ÖNCELIK LABEL'LARI ---
[custom_labels."critical"]
description = "pr_agent: PR fixes critical bugs, security vulnerabilities, or production issues that need immediate attention"

[custom_labels."needs-review"]
description = "pr_agent: PR requires careful review due to complexity, architectural changes, or high risk"
