## 3. Deserialization Vulnerabilities - CRITICAL

### Dangerous Patterns:
```csharp
// ❌ CRITICAL: BinaryFormatter (RCE risk)
var formatter = new BinaryFormatter();
return formatter.Deserialize(stream); // Code execution!

// ❌ HIGH: TypeNameHandling.All
var settings = new JsonSerializerSettings
{
    TypeNameHandling = TypeNameHandling.All // Dangerous!
};
```

### Required Fix:
```csharp
// ✅ System.Text.Json (safe by default)
return JsonSerializer.Deserialize<T>(json);

// ✅ If using Newtonsoft, disable type handling
var settings = new JsonSerializerSettings
{
    TypeNameHandling = TypeNameHandling.None
};
```

