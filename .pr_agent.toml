## 2. Authentication & Authorization - CRITICAL

### Dangerous Patterns to Flag:
```javascript
// ❌ CRITICAL: JWT in localStorage (XSS vulnerable)
localStorage.setItem('token', jwtToken);
sessionStorage.setItem('auth', token);

// ❌ CRITICAL: Hardcoded secrets
const API_SECRET = 'sk_live_123456789';
const ADMIN_PASSWORD = 'admin123';
const DATABASE_URL = 'mongodb://user:pass@...';

// ❌ HIGH: Client-side auth only
if (user.role === 'admin') {
  showAdminPanel(); // Can be bypassed
}
```

### Required Fix:
```javascript
// ✅ JWT in httpOnly cookie (server-side)
// Server: Set-Cookie: token=...; HttpOnly; Secure; SameSite=Strict

// ✅ Environment variables
const API_KEY = process.env.VITE_API_KEY;

// ✅ Backend verification
async function deleteUser(userId) {
  if (!currentUser.isAdmin) return showError(); // UX only
  await api.delete(`/users/${userId}`); // Server verifies
}
```

### Review Actions:
- Flag ANY use of localStorage/sessionStorage for tokens
- Search for hardcoded: password, apiKey, secret, token, private
- Verify authorization checks exist on backend

