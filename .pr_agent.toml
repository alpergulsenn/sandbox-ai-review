# 🧵 EXCEPTION HANDLING
# ═══════════════════════════════════════════════════════════

## 12. Exception Anti-Patterns - HIGH

### Dangerous Patterns:
```csharp
// ❌ HIGH: Swallowing exceptions
public async Task<User> GetUser(int id)
{
    try
    {
        return await _context.Users.FindAsync(id);
    }
    catch (Exception)
    {
        return null; // Loses error info!
    }
}

// ❌ MEDIUM: throw ex (loses stack trace)
public void ProcessOrder(Order order)
{
    try
    {
        ValidateOrder(order);
    }
    catch (Exception ex)
    {
        LogError(ex);
        throw ex; // Should be: throw
    }
}

// ❌ HIGH: Exceptions for control flow
public bool IsAdmin(int userId)
{
    try
    {
        var user = _context.Users.Find(userId);
        return user.Role == "Admin";
    }
    catch (NullReferenceException)
    {
        return false; // Expensive!
    }
}
```

### Required Fix:
```csharp
// ✅ Catch specific, re-throw
public async Task<User> GetUser(int id)
{
    try
    {
        return await _context.Users.FindAsync(id);
    }
    catch (DbUpdateException ex)
    {
        _logger.LogError(ex, "DB error");
        throw;
    }
}

// ✅ throw preserves stack
public void ProcessOrder(Order order)
{
    try
    {
        ValidateOrder(order);
    }
    catch (ValidationException ex)
    {
        _logger.LogWarning(ex, "Validation failed");
        throw; // Preserves trace
    }
}

// ✅ No exceptions for flow
public bool IsAdmin(int userId)
{
    var user = _context.Users.Find(userId);
    return user?.Role == "Admin";
}
```

