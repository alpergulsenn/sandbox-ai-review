### Dangerous Patterns:
```javascript
// ❌ HIGH: Importing entire library
import _ from 'lodash'; // 70KB
import moment from 'moment'; // 290KB
import * as MUI from '@mui/material'; // 500KB+

// ❌ MEDIUM: No code splitting
