# 💉 DEPENDENCY INJECTION ISSUES
# ═══════════════════════════════════════════════════════════

## 10. Captive Dependency - CRITICAL

### Dangerous Patterns:
```csharp
// ❌ CRITICAL: Singleton captures Scoped
public class CacheService // Singleton
{
    private readonly AppDbContext _context; // Scoped!
    
    public CacheService(AppDbContext context)
    {
        _context = context; // Lives forever!
    }
}

// ❌ CRITICAL: Singleton captures HttpContext
public class UserService // Singleton
{
    private readonly IHttpContextAccessor _httpContextAccessor;
    
    public string GetCurrentUser()
    {
        return _httpContextAccessor.HttpContext?.User?.Identity?.Name;
        // Can return wrong user!
    }
}
```

### Required Fix:
```csharp
// ✅ Use IServiceScopeFactory
public class CacheService
{
    private readonly IServiceScopeFactory _scopeFactory;
    
    public CacheService(IServiceScopeFactory scopeFactory)
    {
        _scopeFactory = scopeFactory;
    }
    
    public async Task<User> GetUserAsync(int id)
    {
        using var scope = _scopeFactory.CreateScope();
        var context = scope.ServiceProvider.GetRequiredService<AppDbContext>();
        return await context.Users.FindAsync(id);
    }
}

// ✅ Make service Scoped
services.AddScoped<UserService>();
```

### Review Actions:
- **CRITICAL**: Flag Singleton → Scoped injection
- Check DbContext never in Singleton
- Verify HttpContext only in Scoped
- Suggest IServiceScopeFactory for Singleton → Scoped

---

## 11. Service Locator - HIGH

### Dangerous Pattern:
```csharp
// ❌ HIGH: Hidden dependencies
public class OrderProcessor
{
    private readonly IServiceProvider _serviceProvider;
    
    public async Task Process(Order order)
    {
        var email = _serviceProvider.GetRequiredService<IEmailService>();
        var payment = _serviceProvider.GetRequiredService<IPaymentService>();
        // Hard to test and understand
    }
}
```

### Required Fix:
```csharp
// ✅ Constructor injection
public class OrderProcessor
{
    private readonly IEmailService _emailService;
    private readonly IPaymentService _paymentService;
    
    public OrderProcessor(
        IEmailService emailService,
        IPaymentService paymentService)
