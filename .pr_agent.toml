## 8. Unhandled Promise Rejections - CRITICAL

### Dangerous Patterns:
```javascript
// ❌ CRITICAL: No try-catch
async function saveUser(data) {
  const response = await fetch('/api/users', {
    method: 'POST',
    body: JSON.stringify(data)
  });
  return response.json(); // Unhandled error
}

// ❌ HIGH: forEach with async (doesn't wait!)
async function processUsers(users) {
  users.forEach(async (user) => {
    await saveUser(user); // Runs in parallel, not sequential!
  });
  console.log('Done'); // Logs BEFORE saves finish
}

// ❌ CRITICAL: Promise chain without .catch()
fetchData()
  .then(processData)
  .then(saveResult);
  // No .catch()!
```

### Required Fix:
```javascript
// ✅ Always wrap in try-catch
async function saveUser(data) {
  try {
    const response = await fetch('/api/users', {
      method: 'POST',
      body: JSON.stringify(data)
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    return await response.json();
  } catch (error) {
    console.error('Failed to save:', error);
    throw error;
  }
}

// ✅ Use for...of for sequential
async function processUsers(users) {
  for (const user of users) {
    await saveUser(user);
  }
  console.log('Done'); // Logs AFTER all saves
}

// ✅ Or Promise.all for parallel
async function processUsers(users) {
  await Promise.all(users.map(user => saveUser(user)));
  console.log('Done');
}

// ✅ Always add .catch()
fetchData()
  .then(processData)
  .then(saveResult)
  .catch(error => {
    console.error('Failed:', error);
  });
```

### Review Actions:
- **MANDATORY**: Every async function MUST have try-catch or .catch()
- Flag forEach with async callbacks (suggest for...of or Promise.all)
- Check promise chains end with .catch()
- Verify event handlers with async have error handling

---

## 9. Async Performance Bugs - HIGH

### Sequential When Should Be Parallel:
```javascript
// ❌ HIGH: 650ms total (should be 300ms)
async function loadUserData(userId) {
  const user = await fetchUser(userId);        // 200ms
  const orders = await fetchOrders(userId);    // 300ms
  const prefs = await fetchPrefs(userId);      // 150ms
  return { user, orders, prefs };
}

// ❌ MEDIUM: 100 users = 20 seconds!
async function loadAllUsers(userIds) {
  const users = [];
  for (const id of userIds) {
    const user = await fetchUser(id); // Sequential!
    users.push(user);
  }
  return users;
}
```

### Required Fix:
```javascript
// ✅ Parallel requests (300ms total)
async function loadUserData(userId) {
  const [user, orders, prefs] = await Promise.all([
    fetchUser(userId),
    fetchOrders(userId),
    fetchPrefs(userId)
  ]);
  return { user, orders, prefs };
}

// ✅ Batch parallel (200ms for 100 users)
async function loadAllUsers(userIds) {
  return await Promise.all(
    userIds.map(id => fetchUser(id))
  );
}
```

