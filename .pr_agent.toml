- Look for: import _ from 'lodash' (should be import debounce from 'lodash/debounce')
- Check for large components without lazy loading

### TypeScript Scan:
- Search for: any type usage
- Search for: @ts-ignore or @ts-expect-error
- Check for non-null assertions (!) without validation
- Verify functions have return types

## 5. DO NOT FLAG These:
- Prettier/ESLint auto-fixable issues
- Variable naming (unless critically misleading)
- Formatting (spaces, indentation, semicolons)
- Prefer const over let (unless causes bug)
- Missing comments (unless complex algorithm)

## 6. Specific Pattern Detection

### For useEffect:
```javascript
// ❌ Flag this pattern
useEffect(() => {
  window.addEventListener('resize', handleResize);
}, []); // Missing cleanup

// ✅ Require this fix
useEffect(() => {
  window.addEventListener('resize', handleResize);
  return () => window.removeEventListener('resize', handleResize);
}, []);
```

### For async functions:
```javascript
// ❌ Flag this
async function saveData() {
  await fetch('/api/data');
} // No error handling

// ✅ Require this
async function saveData() {
  try {
    const res = await fetch('/api/data');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (error) {
    console.error('Save failed:', error);
    throw error;
  }
}
```

### For React Query:
```javascript
// ❌ Flag this (anti-pattern)
useEffect(() => {
  fetch('/api/users').then(setUsers);
}, []);

// ✅ Suggest this
const { data: users } = useQuery({
  queryKey: ['users'],
  queryFn: () => fetch('/api/users').then(r => r.json())
});
```

## 7. Output Format Requirements

### Title Format:
[Category]: [Specific Issue] in [filename]:[line]

Examples:
- Security: XSS Vulnerability in UserProfile.jsx:45
- Memory Leak: Missing Cleanup in Dashboard.jsx:78
- Performance: N+1 Query in OrderList.jsx:112
- React Hook: Missing Dependency in useUserData.ts:23

### Problem Description Format:
**Problem:** [1-2 sentence explanation]
**Risk:** [Concrete impact - what could happen]
**Impact:** [Severity - how bad it is]

### Code Example Format:
Always show:
1. Current problematic code (with line numbers)
2. Fixed version with diff syntax
3. Why the fix works

### Performance Impact Format:
Quantify when possible:
- "5KB memory leak per mount/unmount"
- "10,000x slower than Map lookup"
- "100 requests instead of 1"
- "1 second lag on page load"

## 8. Edge Cases to Watch

### Vue.js:
- Check computed properties don't have side effects
- Verify v-for has :key
- Check watchers have deep: true if watching objects

### Angular:
- Check OnDestroy implements cleanup
- Verify RxJS subscriptions unsubscribe
- Check change detection strategy

### Next.js:
- Flag browser APIs (window, document) in SSR components
- Check getServerSideProps for data fetching, not useEffect
- Verify Image component used instead of <img>

### Node.js Express:
- Check middleware errors have 4 parameters
- Verify async route handlers use try-catch
- Check CORS is not wildcarded

## 9. Final Validation

Before submitting review, verify:
- [ ] Found 5-8 issues
- [ ] At least 1 CRITICAL or 2 HIGH priority
- [ ] Each issue has code example
- [ ] Each issue has suggested fix
- [ ] Line numbers included
- [ ] Impact quantified where possible
- [ ] No false positives (double-check)
"""

[pr_code_suggestions]
num_code_suggestions = 5

extra_instructions = """
# ARCHITECTURAL REFACTORING SUGGESTIONS

Provide high-impact refactoring suggestions:

## 1. Callback Hell → Async/Await
When nested callbacks detected, suggest Promise-based refactor:
- Show current callback nesting
- Provide clean async/await version
- Quantify readability improvement

## 2. Linear Search → Map/Index
When Array.find in hot path, suggest Map:
- Show O(n) current implementation
- Provide O(1) Map-based version
- Calculate performance improvement

## 3. Empty Catch → Retry Strategy
When empty catch blocks found, suggest:
- Exponential backoff retry
- Circuit breaker pattern
- Proper error logging

## 4. God Component → Composition
When component >200 lines, suggest:
- Extract custom hooks
- Split into smaller components
- Separate concerns

## 5. Sequential Await → Promise.all
When independent requests sequential, suggest:
- Parallel execution with Promise.all
- Calculate latency reduction

Each suggestion must show:
- Current code
- Refactored version
- Impact metrics (speed, size, maintainability)
- Why it matters
"""

