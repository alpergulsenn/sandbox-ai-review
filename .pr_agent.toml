## 10. Hooks Rules Violations - CRITICAL

### Breaking Rules of Hooks:
```javascript
// ❌ CRITICAL: Conditional hook
function UserProfile({ userId }) {
  if (!userId) return null;
  
  const user = useQuery(['user', userId], fetchUser);
  // Hook called conditionally!
}

// ❌ CRITICAL: Hook in loop
function ItemList({ items }) {
  return items.map(item => {
    const [selected, setSelected] = useState(false);
    // Hook in loop!
  });
}

// ❌ HIGH: Missing dependencies
useEffect(() => {
  fetchData(userId); // Uses userId
}, []); // Missing userId in deps
```

### Required Fix:
```javascript
// ✅ Hooks at top level
function UserProfile({ userId }) {
  const user = useQuery(['user', userId], fetchUser, {
    enabled: !!userId
  });
  
  if (!userId) return null;
  return <div>{user.data?.name}</div>;
}

// ✅ Extract component
function ItemList({ items }) {
  return items.map(item => (
    <ItemComponent key={item.id} item={item} />
  ));
}

function ItemComponent({ item }) {
  const [selected, setSelected] = useState(false);
  return <Item selected={selected} />;
}

// ✅ Complete dependencies
useEffect(() => {
  fetchData(userId);
}, [userId]); // userId added
```

### Review Actions:
- **CRITICAL**: Check ALL hooks at top level (not in if/loop/nested function)
- Verify useEffect dependencies include ALL used variables
- Flag objects/functions in deps (suggest useMemo/useCallback)
- Check ESLint react-hooks/exhaustive-deps warnings

---

## 11. Infinite Re-render Loops - CRITICAL

### Dangerous Patterns:
```javascript
// ❌ CRITICAL: setState in render
function Counter() {
  const [count, setCount] = useState(0);
  
  setCount(count + 1); // Infinite loop!
  
  return <div>{count}</div>;
}

// ❌ CRITICAL: useEffect without deps updates state
function AutoIncrement() {
  const [count, setCount] = useState(0);
  
  useEffect(() => {
    setCount(count + 1); // Re-runs every render → infinite
  }); // Missing dependency array
}
```

### Required Fix:
```javascript
// ✅ setState in event handlers
function Counter() {
  const [count, setCount] = useState(0);
  
  return (
    <button onClick={() => setCount(count + 1)}>
      {count}
    </button>
  );
}

// ✅ useEffect with proper deps
function AutoIncrement() {
  const [count, setCount] = useState(0);
  
  useEffect(() => {
    const timer = setTimeout(() => setCount(c => c + 1), 1000);
    return () => clearTimeout(timer);
  }, []); // Empty deps
}
```

---

## 12. useEffect Cleanup Issues - CRITICAL

### Missing Cleanup:
```javascript
// ❌ CRITICAL: Subscription not cleaned
useEffect(() => {
  const subscription = API.subscribe(handleData);
  // Missing cleanup!
}, []);

// ❌ HIGH: setState after unmount (race condition)
useEffect(() => {
  fetchData().then(data => {
    setData(data); // Component might have unmounted
  });
}, []);
```

### Required Fix:
```javascript
// ✅ Cleanup subscription
useEffect(() => {
  const subscription = API.subscribe(handleData);
  
  return () => subscription.unsubscribe();
}, []);

// ✅ Prevent setState after unmount
useEffect(() => {
  let cancelled = false;
  
  fetchData().then(data => {
    if (!cancelled) {
      setData(data);
    }
  });
  
  return () => { cancelled = true; };
}, []);
```

