## 1. XSS (Cross-Site Scripting) - CRITICAL

### Dangerous Patterns to Flag:
```javascript
// ❌ CRITICAL: Direct HTML injection
element.innerHTML = userInput;
div.outerHTML = `<div>${userName}</div>`;

// ❌ CRITICAL: React without sanitization
<div dangerouslySetInnerHTML={{ __html: apiResponse }} />

// ❌ HIGH: eval() and Function() constructor
eval(userCode);
new Function(userInput)();
setTimeout(userInput, 1000); // String argument
```

### Required Fix:
```javascript
// ✅ Use textContent for plain text
element.textContent = userInput;

// ✅ Use DOMPurify for HTML
import DOMPurify from 'dompurify';
element.innerHTML = DOMPurify.sanitize(userInput);

// ✅ React: Sanitize before rendering
import DOMPurify from 'isomorphic-dompurify';
<div dangerouslySetInnerHTML={{ 
  __html: DOMPurify.sanitize(apiResponse) 
}} />
```

### Review Actions:
- Flag ANY use of innerHTML, outerHTML, dangerouslySetInnerHTML wit hout DOMPurify
- Flag eval(), Function(), setTimeout/setInterval with string arguments
- Check for user input in document.write(), location.href

---

## 2. Authentication & Authorization - CRITICAL

### Dangerous Patterns to Flag:
```javascript
// ❌ CRITICAL: JWT in localStorage (XSS vulnerable)
localStorage.setItem('token', jwtToken);
sessionStorage.setItem('auth', token);

// ❌ CRITICAL: Hardcoded secrets
const API_SECRET = 'sk_live_123456789';
const ADMIN_PASSWORD = 'admin123';
const DATABASE_URL = 'mongodb://user:pass@...';

// ❌ HIGH: Client-side auth only
if (user.role === 'admin') {
  showAdminPanel(); // Can be bypassed
}
```

### Required Fix:
```javascript
// ✅ JWT in httpOnly cookie (server-side)
// Server: Set-Cookie: token=...; HttpOnly; Secure; SameSite=Strict

// ✅ Environment variables
const API_KEY = process.env.VITE_API_KEY;

// ✅ Backend verification
async function deleteUser(userId) {
  if (!currentUser.isAdmin) return showError(); // UX only
  await api.delete(`/users/${userId}`); // Server verifies
}
```

### Review Actions:
- Flag ANY use of localStorage/sessionStorage for tokens
- Search for hardcoded: password, apiKey, secret, token, private
- Verify authorization checks exist on backend

---

## 3. Server-Side Injection (Node.js) - CRITICAL

### Dangerous Patterns to Flag:
```javascript
// ❌ CRITICAL: SQL Injection
const query = `SELECT * FROM users WHERE email = '${userEmail}'`;
db.execute(query);

// ❌ CRITICAL: Command Injection (RCE)
const { exec } = require('child_process');
exec(`convert ${userFileName}.jpg output.png`);

// ❌ CRITICAL: Path Traversal
const filePath = path.join(__dirname, 'uploads', req.query.filename);
fs.readFileSync(filePath); // User: "../../etc/passwd"

// ❌ HIGH: NoSQL Injection
User.find({ email: req.body.email }); // Attacker: {"$gt": ""}
```

### Required Fix:
```javascript
// ✅ Parameterized queries
const query = 'SELECT * FROM users WHERE email = ?';
db.execute(query, [userEmail]);

// ✅ Use libraries instead of shell
const sharp = require('sharp');
await sharp(userFileName).toFile('output.png');

// ✅ Sanitize file paths
const safeName = path.basename(req.query.filename);
const filePath = path.join(__dirname, 'uploads', safeName);
if (!filePath.startsWith(path.join(__dirname, 'uploads'))) {
  throw new Error('Invalid path');
}

// ✅ Validate NoSQL input
const email = typeof req.body.email === 'string' ? req.body.email : '';
User.find({ email });
```

### Review Actions:
- Flag string concatenation in SQL/database queries
- Flag child_process.exec() with user input
- Check file operations for path traversal
- Verify NoSQL queries sanitize object inputs

