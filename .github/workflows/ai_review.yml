name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      # Kaynak kodu içeri al
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. adım - Değişen dosyaların dilini tespit et
      - name: Detect Changes
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            java:
              - '**/*.java'
              - '**/*.jar'
            js:
              - '**/*.js'
              - '**/*.ts'
              - '**/*.jsx'
            csharp:
              - '**/*.cs'
              - '**/*.csproj'

        #2. Adım: MD Dosyalarından Kuralları Okuyup Değişkeni Hazırla
      - name: Construct Dynamic Rules from Files
        id: rule_builder
        run: |
          ACCUMULATED_RULES=""

          # ---------------- JAVA LOGIC ----------------
          if [[ "${{ steps.changes.outputs.java_any_changed }}" == "true" ]]; then
            echo "Java changes detected. Loading java_rules.md..."
            
            # Dosya içeriğini değişkene atıyoruz
            JAVA_CONTENT=$(cat .github/pr_rules/java_rules.md)
            
            # Ana kural setine ekliyoruz (Başlık ekleyerek)
            ACCUMULATED_RULES="${ACCUMULATED_RULES}\n\n### JAVA ARCHITECTURE STANDARDS:\n${JAVA_CONTENT}"
          fi

          # ---------------- JS/TS LOGIC ----------------
          if [[ "${{ steps.changes.outputs.js_any_changed }}" == "true" ]]; then
            echo "JS changes detected. Loading js_rules.md..."
            
            JS_CONTENT=$(cat .github/pr_rules/js_rules.md)
            
            ACCUMULATED_RULES="${ACCUMULATED_RULES}\n\n### JAVASCRIPT/TS GUIDELINES:\n${JS_CONTENT}"
          fi

          # ---------------- C# LOGIC ----------------
          if [[ "${{ steps.changes.outputs.csharp_any_changed }}" == "true" ]]; then
            echo "C# changes detected. Loading csharp_rules.md..."
            
            CS_CONTENT=$(cat .github/pr_rules/csharp_rules.md)
            
            ACCUMULATED_RULES="${ACCUMULATED_RULES}\n\n### C# CORPORATE RULES:\n${CS_CONTENT}"
          fi

          # Eğer hiç kural yüklenmediyse default bir mesaj koyabiliriz (Opsiyonel)
          if [[ -z "$ACCUMULATED_RULES" ]]; then
            ACCUMULATED_RULES="Apply standard Clean Code principles."
          fi

          # KRİTİK NOKTA: Multiline içeriği GITHUB_ENV'e güvenle yazmak
          # EOF (End of File) delimiter tekniği kullanıyoruz.
          {
            echo "DYNAMIC_EXTRA_INSTRUCTIONS<<EOF"
            echo -e "$ACCUMULATED_RULES"
            echo "EOF"
          } >> $GITHUB_ENV

      # 3. Adım: Debugging (Modelin ne göreceğini loglara basıyoruz)
      - name: Debug Rules
        run: |
          echo "🔍 ENJECTE EDİLECEK KURALLAR:"
          echo "${{ env.DYNAMIC_EXTRA_INSTRUCTIONS }}"

      # Botu çalıştır ---
      - name: Create Credentials File
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json

      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main # Kaynak koddan build eder. Her seferinde build etmesin diye aşağıdaki kodu kullandık.

        env:
          # --- GCP VERTEX AI AUTH ---
          GITHUB_TOKEN: ${{ github.token }}
          VERTEX_AI_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERTEX_AI_LOCATION: "us-central1"
          GOOGLE_APPLICATION_CREDENTIALS: "/github/workspace/gcp_key.json"

          PRREVIEWER_EXTRA_INSTRUCTIONS: ${{ env.DYNAMIC_EXTRA_INSTRUCTIONS }}
          PR_CODE_SUGGESTIONS_EXTRA_INSTRUCTIONS: ${{ env.DYNAMIC_EXTRA_INSTRUCTIONS }}

          # --- GITHUB ACTION AUTO SETTINGS ---
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_GENERATE_LABELS: "false"
