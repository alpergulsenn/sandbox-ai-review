name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      # Kaynak kodu içeri al
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. adım - Değişen dosyaların dilini tespit et
      - name: Detect Changes
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            java:
              - '**/*.java'
              - '**/*.jar'
            js:
              - '**/*.js'
              - '**/*.ts'
              - '**/*.jsx'
            csharp:
              - '**/*.cs'
              - '**/*.csproj'

        #2. Adım: MD Dosyalarından Kuralları Okuyup Değişkeni Hazırla
      - name: Construct Dynamic Rules from Files
        id: rule_builder
        run: |
          echo "### 🛡️ Active Security & Architecture Protocols" > active_rules.md
          echo "*(Auto-injected via Workflow)*" >> active_rules.md
          echo "" >> active_rules.md            

          # C# Logic
          if [[ "${{ steps.changes.outputs.csharp_any_changed }}" == "true" ]]; then
            echo -e "\n\n" >> active_rules.md
            cat .github/pr_rules/csharp_rules.md >> active_rules.md
          fi

          # Java Logic
          if [[ "${{ steps.changes.outputs.java_any_changed }}" == "true" ]]; then
            echo -e "\n\n" >> active_rules.md
            cat .github/pr_rules/java_rules.md >> active_rules.md
          fi

          # JS/TS Logic
          if [[ "${{ steps.changes.outputs.js_any_changed }}" == "true" ]]; then
            echo -e "\n\n" >> active_rules.md
            cat .github/pr_rules/js_rules.md >> active_rules.md
          fi

          {
            echo "PR_REVIEWER__EXTRA_INSTRUCTIONS<<EOF"
            cat active_rules.md
            echo "EOF"
          } >> $GITHUB_ENV

          {
            echo "PR_CODE_SUGGESTIONS__EXTRA_INSTRUCTIONS<<EOF"
            cat active_rules.md
            echo "EOF"
          } >> $GITHUB_ENV

      # 3. Adım: Debugging (Artık backtick hatası görmemelisin)
      - name: Debug Rules
        run: |
          echo "🔍 ENJECTE EDİLEN KURALLAR (RAW VIEW):"
          cat active_rules.md

      # Botu çalıştır ---
      - name: Create Credentials File
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json

      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main # Kaynak koddan build eder. Her seferinde build etmesin diye aşağıdaki kodu kullandık.

        env:
          # --- GCP VERTEX AI AUTH ---
          GITHUB_TOKEN: ${{ github.token }}
          VERTEX_AI_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERTEX_AI_LOCATION: "us-central1"
          GOOGLE_APPLICATION_CREDENTIALS: "/github/workspace/gcp_key.json"

          # --- GITHUB ACTION AUTO SETTINGS ---
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_GENERATE_LABELS: "false"
          CONFIG__MODEL_TEMPERATURE: "0.2"
