name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      # Kaynak kodu içeri al
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. adım - Değişen dosyaların dilini tespit et
      - name: Detect Changes
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            java:
              - '**/*.java'
              - '**/*.jar'
            js:
              - '**/*.js'
              - '**/*.ts'
              - '**/*.jsx'
            csharp:
              - '**/*.cs'
              - '**/*.csproj'

        #2. Adım: MD Dosyalarından Kuralları Okuyup Değişkeni Hazırla
      - name: Construct Dynamic Rules from Files
        id: rule_builder
        run: |
          # 1. Önce geçici bir "rules.txt" dosyası oluşturuyoruz.
          # Bu dosya bizim güvenli tampon bölgemiz.
            echo "Context: Corporate Architectural Review Mode Active" > final_rules.txt
            
            # ---------------- C# LOGIC ----------------
            if [[ "${{ steps.changes.outputs.csharp_any_changed }}" == "true" ]]; then
              echo -e "\n\n" >> final_rules.txt
              # cat komutu içeriği yorumlamadan direkt sona ekler (APPEND)
              cat .github/pr_rules/csharp_rules.md >> final_rules.txt
            fi

            # ---------------- JAVA LOGIC ----------------
            if [[ "${{ steps.changes.outputs.java_any_changed }}" == "true" ]]; then
              echo -e "\n\n" >> final_rules.txt
              cat .github/pr_rules/java_rules.md >> final_rules.txt
            fi

            # ---------------- JS/TS LOGIC ----------------
            if [[ "${{ steps.changes.outputs.js_any_changed }}" == "true" ]]; then
              echo -e "\n\n" >> final_rules.txt
              cat .github/pr_rules/js_rules.md >> final_rules.txt
            fi

            # 2. Şimdi bu temiz dosyayı GitHub ENV'ye aktarıyoruz.
            # "EOF" bloğu sayesinde ters tırnaklar sorun çıkarmaz.
            
            echo "DYNAMIC_EXTRA_INSTRUCTIONS<<EOF" >> $GITHUB_ENV
            cat final_rules.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

      # 3. Adım: Debugging (Artık backtick hatası görmemelisin)
      - name: Debug Rules
        run: |
          echo "🔍 ENJECTE EDİLEN KURALLAR (RAW VIEW):"
          cat final_rules.txt

      # Botu çalıştır ---
      - name: Create Credentials File
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json

      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main # Kaynak koddan build eder. Her seferinde build etmesin diye aşağıdaki kodu kullandık.

        env:
          # --- GCP VERTEX AI AUTH ---
          GITHUB_TOKEN: ${{ github.token }}
          VERTEX_AI_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERTEX_AI_LOCATION: "us-central1"
          GOOGLE_APPLICATION_CREDENTIALS: "/github/workspace/gcp_key.json"

          #PRREVIEWER__EXTRA_INSTRUCTIONS: ${{ env.DYNAMIC_EXTRA_INSTRUCTIONS }}
          #PR_CODE_SUGGESTIONS__EXTRA_INSTRUCTIONS: ${{ env.DYNAMIC_EXTRA_INSTRUCTIONS }}

          # --- GITHUB ACTION AUTO SETTINGS ---
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_GENERATE_LABELS: "false"
