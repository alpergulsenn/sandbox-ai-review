name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      # Kaynak kodu ve .pr_agent.toml'u içeri al
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Botu çalıştır ---
      - name: Create Credentials File
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json

      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main # Kaynak koddan build eder. Her seferinde build etmesin diye aşağıdaki kodu kullandık.

        env:
          # --- GCP VERTEX AI AUTH ---
          GITHUB_TOKEN: ${{ github.token }}
          VERTEX_AI_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERTEX_AI_LOCATION: "us-central1"
          GOOGLE_APPLICATION_CREDENTIALS: "/github/workspace/gcp_key.json"

          # --- GITHUB ACTION AUTO SETTINGS ---
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_GENERATE_LABELS: "true"

          PR_REVIEWER.SYSTEM_PROMPT: |
            If PR description contains Turkish keywords (düzelt, güncelle, ekle, hata):
            → Respond in Turkish

            If English keywords (fix, update, add, bug):
            → Respond in English

            ALWAYS keep technical terms in English:
            - useEffect, async/await, XSS, SQL injection, dangerouslySetInnerHTML

            Example Turkish response:
            ## 🔴 KRİTİK Sorunlar
            ### 1. Güvenlik: XSS Açığı
            **Sorun:** dangerouslySetInnerHTML sanitizasyon olmadan kullanılmış
            **Risk:** Saldırgan zararlı kod enjekte edebilir
            
