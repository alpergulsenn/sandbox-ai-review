name: PR Agent Workflow

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      # Kaynak kodu içeri al
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rules
        uses: ./.github/actions/prepare-rules

        # 3. ADIM: DEBUG (Kuralların yüklenip yüklenmediğini kontrol et)
      - name: Debug Environment Variables
        run: |
          echo "Checking injected variables..."
          echo "PR_REVIEWER__EXTRA_INSTRUCTIONS: $PR_REVIEWER__EXTRA_INSTRUCTIONS"

      # Botu çalıştır ---
      - name: Create Credentials File
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json

      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main # Kaynak koddan build eder. Her seferinde build etmesin diye aşağıdaki kodu kullandık.

        env:
          # --- GCP VERTEX AI AUTH ---
          GITHUB_TOKEN: ${{ github.token }}
          VERTEX_AI_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERTEX_AI_LOCATION: "us-central1"
          GOOGLE_APPLICATION_CREDENTIALS: "/github/workspace/gcp_key.json"

          # --- GITHUB ACTION AUTO SETTINGS ---
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_GENERATE_LABELS: "false"
          CONFIG__VERBOSITY_LEVEL: "2"
          GLOBAL__LOG_LEVEL: "INFO"

      - name: Customize Title
        if: always() # Hata olsa bile çalış
        uses: ./.github/actions/customize-title
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
