name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job: 
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      # Botu çalıştır ---
      - name: Create Credentials File
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json

      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main

        env:
          # --- GITHUB TOKEN (EN ÖNCE) ---
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # --- GCP AUTHENTICATION (Direkt secret'tan) ---
          VERTEX_AI_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERTEX_AI_LOCATION: "us-central1"
          GOOGLE_APPLICATION_CREDENTIALS: "/github/workspace/gcp_key.json"

          # --- MODEL CONFIG (HIBRİT YAPI) --- (vertex_ai/ ön eki botun OpenAI'a gitmesini engeller)
          CONFIG.MODEL: "vertex_ai/gemini-2.0-flash-001" # Derin analiz için
          CONFIG.MODEL_TURBO: "vertex_ai/gemini-2.0-flash-001" # Etiketleme ve özet için  
          CONFIG.FALLBACK_MODELS: "[]"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "8192"
          
          # --- FILTERING (GÜRÜLTÜ ENGELLEME) ---
          # İstenmeyen dosyaları görmezden gel
          CONFIG.IGNORE_FILE_EXTENSIONS: "['.json', '.md', '.css', '.lock', '.svg', '.html']"

          # --- GITHUB ACTION AUTO SETTINGS ---
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_GENERATE_LABELS: "true"

          # --- PR DESCRIPTION SETTINGS ---
          PR_DESCRIPTION.PUBLISH_LABELS: "true"
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMENT: "true"
          PR_DESCRIPTION.USE_DESCRIPTION_MARKERS: "false" # Sorunu çözmek için false yapalım
          PR_DESCRIPTION.ADD_ORIGINAL_USER_DESCRIPTION: "true"

          # --- CUSTOM LABELS ---
          config.enable_custom_labels: "true"  # Custom label'ları aktifleştir

          # --- REVIEWER CONFIGURATION ---
          pr_reviewer.require_score_review: "false"
          pr_reviewer.require_tests_review: "false"
          pr_reviewer.require_estimate_effort_to_review: "true"
          pr_reviewer.require_can_be_split_review: "false"
          pr_reviewer.num_code_suggestions: 5
          pr_reviewer.inline_code_comments: "true"
          pr_reviewer.persistent_comment: "true" 

          # --- REVIEW LABELS (Otomatik label'lar) ---
          pr_reviewer.enable_review_labels_effort: "true"     # review effort [1-5/5] etiketi
          pr_reviewer.enable_review_labels_security: "true"   # possible security issue etiketi
          pr_reviewer.enable_auto_approval: "false"

          # --- SEVERITY FILTERING ---
          pr_reviewer.minimal_severity: "Medium"
          pr_reviewer.require_security_review: "true"
          
          # --- DYNAMIC LANGUAGE & PERSONA ---
          PR_REVIEWER.SYSTEM_PROMPT: |
              You are a Senior Software Architect. 
              DYNAMIC LANGUAGE RULE:
              Detect the language used in the PR description or the user's comment.
              - If the user writes in Turkish, respond in Turkish.
              - If the user writes in English, respond in English.
              - Keep technical architecture terms in English (e.g., Dependency Injection, Single Responsibility Principle).

          # --- CORE REVIEW INSTRUCTIONS (SOLID, SECURITY, CUSTOM URL) ---
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            1. CLEAN CODE: Evaluate code against SOLID, DRY, and KISS principles.
            2. SECURITY SCAN: Check for OWASP vulnerabilities and potential CVE-related patterns.
            3. EXTERNAL STANDARDS: Use the coding patterns from https://www.baeldung.com/java-8-streams as a mandatory reference. 
               Ensure that any Java Stream usage follows the efficiency and readability rules described on that page.
            4. HIGH IMPACT ONLY: Do not comment on formatting or minor style choices. 
               Only report issues that affect system stability, performance, or security.

         # --- DEBUG MODE ---
          config.verbosity_level: 2
          github_action_config.enable_output: "true"          