name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      # --- ADIM 1: JSON ANAHTARINI DOSYAYA YAZ (KRİTİK) ---
      - name: Create Credentials File
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp_key.json

      # --- ADIM 2: BOTU ÇALIŞTIR ---
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          # Model Tanımları (vertex_ai/ ön eki botun OpenAI'a gitmesini engeller)
          CONFIG.MODEL: "vertex_ai/gemini-1.5-flash"
          CONFIG.MODEL_TURBO: "vertex_ai/gemini-1.5-flash"
          
          # Vertex AI Bağlantı Bilgileri
          VERTEX_AI_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERTEX_AI_LOCATION: "us-central1"
          
          # Kimlik Doğrulama (Dosya yolunu gösteriyoruz)
          GOOGLE_APPLICATION_CREDENTIALS: "/tmp/gcp_key.json"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Faz 3: Özelleştirmeler
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Lütfen incelemeyi Türkçe yap. Clean Code (SOLID, DRY) prensiplerine göre detaylı eleştiri ver."
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "false"
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMENT: "true"