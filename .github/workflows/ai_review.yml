name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job: 
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      # Kaynak kodu ve .pr_agent.toml'u içeri al
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Botu çalıştır ---
      - name: Create Credentials File
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json

        
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main # Kaynak koddan build eder. Her seferinde build etmesin diye aşağıdaki kodu kullandık.
        
        env:
          # --- GCP VERTEX AI AUTH ---
          GITHUB_TOKEN: ${{ github.token }}
          VERTEX_AI_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERTEX_AI_LOCATION: "us-central1"
          GOOGLE_APPLICATION_CREDENTIALS: "/github/workspace/gcp_key.json"

          # --- MODEL CONFIG (HIBRİT YAPI) --- (vertex_ai/ ön eki botun OpenAI'a gitmesini engeller)
          CONFIG.MODEL: "vertex_ai/gemini-2.0-flash-001" # Derin analiz için
          CONFIG.MODEL_TURBO: "vertex_ai/gemini-2.0-flash-001" # Etiketleme ve özet için  
          CONFIG.FALLBACK_MODELS: "[]"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "8192"
          CONFIG.PUBLISH_OUTPUT: "true"  # Loglarda Token usage.

        
          # --- FILTERING (GÜRÜLTÜ ENGELLEME) ---
          # İstenmeyen dosyaları görmezden gel
          CONFIG.IGNORE_FILE_EXTENSIONS: "['.json', '.md', '.css', '.lock', '.svg', '.html']"

          # --- GITHUB ACTION AUTO SETTINGS ---
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_GENERATE_LABELS: "true"

              # --- PR DESCRIPTION SETTINGS (Custom Labellar Otomatik) ---
          PR_DESCRIPTION.ENABLE_CUSTOM_LABELS: "true"

          PR_DESCRIPTION.USE_DESCRIPTION_MARKERS: "false" 
          PR_DESCRIPTION.ADD_ORIGINAL_USER_DESCRIPTION: "true"

          # --- REVIEWER CONFIGURATION ---
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "true"
          PR_REVIEWER.REQUIRE_CAN_BE_SPLIT_REVIEW: "false"
          PR_REVIEWER.NUM_CODE_SUGGESTIONS: 8
          PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
          PR_REVIEWER.PERSISTENT_COMMENT: "true" 

          # --- REVIEW LABELS (Custom labellar otomatik apply edilir) ---
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: "true"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "false"
          PR_REVIEWER.ENABLE_AUTO_APPROVAL: "false"

          # --- SEVERITY FILTERING ---
          PR_REVIEWER.MINIMAL_SEVERITY: "Medium"
          PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"
          
          # --- PR DESCRIPTION: TEMİZ VE STRATEJİK ---
          PR_DESCRIPTION.MAIN_INSTRUCTION: |
              Create a "Technical Architecture Summary." 
              - Explain the 'Context Logic' behind the changes.
              - Focus on High-Impact Architectural Debt.
              - **STRICT RULE:** Do not list linter/formatting issues (var, ==, empty catch) in the description.

          # --- DYNAMIC LANGUAGE & PERSONA ---
          PR_REVIEWER.SYSTEM_PROMPT: |
              You are a Senior Software Architect. 
              Your mission is NOT to act as a linter. Ignore syntax, formatting, and naming unless it causes a bug.
              Focus 100% on:
              - Design Patterns and Architecture.
              - Logic Correctness and Business Rules.
              - System Scalability and Performance.
              - Security Vulnerabilities.
              DYNAMIC LANGUAGE RULE:
              Detect the language used in the PR description or the user's comment.
              - If the user writes in Turkish, respond in Turkish.
              - If the user writes in English, respond in English.
              - Keep technical architecture terms in English (e.g., Dependency Injection, Single Responsibility Principle).

          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
              You are an Auditor. Do not act as a linter. 
              Find exactly 5-6 issues from these categories:
              1. **LOGIC COLLISION:** Identify duplicate parameters like `calculateFinalPrice(price, price)` which break logic.
              2. **ARCHITECTURAL DEBT:** Highlight SRP violations where logic and I/O are coupled.
              3. **PERFORMANCE:** Catch $O(n)$ searches in large arrays where a Map/Index is needed.
              4. **SECURITY:** Treat hardcoded internal URLs as high-risk exposure.
              5. **RELIABILITY:** Flag empty catch blocks and missing 'await' calls as potential system failures.
              RELEVANCE GATE (MANDATORY):
                - Before answering any /ask request, first determine whether the input is relevant to:
                  * Software development
                  * Code review
                  * System design
                  * Security
                  * The programming languages or technologies used in this repository
                - If the request is NOT relevant, DO NOT answer the question.
                - Instead, respond with a short rejection message.

              ALLOWED RESPONSE WHEN IRRELEVANT:
                - "This request is not related to the codebase or software development. Please ask a code-related question."
                - "The provided link or question is not relevant to this repository's technology stack."

              STRICT RULE:
                - Never attempt to infer, guess, or creatively answer irrelevant questions.

              TECHNOLOGY MATCH CHECK:
                - If a link or document is provided, verify that it matches the repository's primary languages.
                - If the link targets a different ecosystem (e.g., Java docs for a C# repo),
                  respond that the resource is not applicable and do not summarize it.
              
                  NON-TECHNICAL INPUT:
                - If the user input is casual, conversational, or unrelated (e.g. "hi", "naber"),
                  respond with:
                  "I can only assist with code-related or technical questions in this context."


          # --- CODE SUGGESTIONS: ARCHITECTURAL REFACTORING ---
          PR_CODE_SUGGESTIONS.NUM_CODE_SUGGESTIONS: 5
          
          PR_CODE_SUGGESTIONS.MAIN_INSTRUCTION: |
              Instead of simple fixes, provide "Architectural Refactoring" suggestions.
              - Focus on modern patterns (e.g., converting Callback Hell to Async/Await).
              - Suggest high-performance data structures (e.g., replacing Array.filter with Map).
              - Resolve Logical Collisions (Shadowing) with clear descriptive naming.

          PR_CODE_SUGGESTIONS.EXTRA_INSTRUCTIONS: |
              1. **PATTERN REFACTOR:** If you find nested timeouts (Callback Hell), provide a refactored version using `Promise.all` or a clean `async/await` chain.
              2. **PERFORMANCE UPGRADE:** For the linear search in `findOrderByUser`, suggest an implementation using a `Map` in the constructor for O(1) lookups.
              3. **LOGIC COLLISION:** When fixing shadowing (e.g., price, price), explain the "Cognitive Load" it creates and suggest domain-driven naming.
              4. **ERROR ROBUSTNESS:** Don't just add a log to empty catch blocks; suggest a proper error propagation or recovery strategy.

          # --- ASK ARACINI DENETÇİYE DÖNÜŞTÜRME ---
          PR_QUESTIONS.SYSTEM_PROMPT: |
            Sen Senior Software Architect ve Denetçisin. 
            Sana sorulan her soruda önce 'PR ile alakasını' sorgula. 
            Eğer alakasızsa veya bir geyik muhabbetiyse "PR bağlamı dışı" diyerek reddet.    