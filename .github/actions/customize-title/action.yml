name: "Customize PR Title"
description: "Renames the PR Agent comment title"
inputs:
  token:
    description: "GitHub Token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Customize PR Review Title
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { owner, repo, number } = context.issue;

          const comments = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number: number,
          });

          const targetComment = comments.data.find(c => 
            c.body.includes('PR Reviewer Guide') && 
            c.user.type === 'Bot'
          );

          if (targetComment) {
            console.log(`Found PR Agent comment ID: ${targetComment.id}`);
            const newBody = targetComment.body.replace(
              /## PR Reviewer Guide .*/, 
              '## 🎩 Review of Abralabs PR Agent'
            );

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: targetComment.id,
              body: newBody
            });
          }
