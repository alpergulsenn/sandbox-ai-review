name: "Prepare Corporate Rules"
description: "Detects changed files and injects specific architectural rules"
outputs:
  has_changes:
    description: "Was any relevant change detected?"
    value: ${{ steps.changes.outputs.src }}

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # 1. Değişiklikleri Tespit Et (TJ Actions buraya taşındı)
    - name: Detect Changes
      id: changes
      uses: tj-actions/changed-files@v44
      with:
        files_yaml: |
          java:
            - '**/*.java'
            - '**/*.jar'
            - 'pom.xml'
          js:
            - '**/*.js'
            - '**/*.jsx'
            - '**/*.ts'
            - 'package.json'
          csharp:
            - '**/*.cs'
            - '**/*.csproj'

    - name: Construct Dynamic Rules (Safe Mode)
      shell: bash
      run: |
        # 1. Kuralları Birleştir
        #echo "### 🛡️ Abralabs Architectural Protocols" > active_rules.md
        #echo "" >> active_rules.md

        #cat .github/pr_rules/architecture_scanner.md >> active_rules.md
        #echo "" >> active_rules.md

        # 1. Kural Dosyasını Temizle/Başlat
        echo "" >> active_rules.md

        # System Override & Output Format
        cat .github/pr_rules/system_override.md >> active_rules.md
        echo "" >> active_rules.md

        if [[ "${{ steps.changes.outputs.csharp_any_changed }}" == "true" ]]; then
          echo -e "\n\n" >> active_rules.md
          cat .github/pr_rules/csharp_rules.md >> active_rules.md
        fi

        if [[ "${{ steps.changes.outputs.java_any_changed }}" == "true" ]]; then
          echo -e "\n\n" >> active_rules.md
          cat .github/pr_rules/java_rules.md >> active_rules.md
        fi

        # JS Logic
        if [[ "${{ steps.changes.outputs.js_any_changed }}" == "true" ]]; then
          echo -e "\n\n" >> active_rules.md
          cat .github/pr_rules/js_rules.md >> active_rules.md
        fi

        # -----------------------------------------------------------------
        # GÜVENLİ ENJEKSİYON (RANDOM DELIMITER)
        # -----------------------------------------------------------------
        # Rastgele bir sınır kelimesi üretiyoruz (Örn: RULE_BLOCK_173849...)
        # Bu sayede kodun içinde "EOF" geçse bile script patlamaz.

        DELIMITER="RULE_BLOCK_$(date +%s)"

        # PR_REVIEWER için kuralları env'e yaz
        echo "PR_REVIEWER__EXTRA_INSTRUCTIONS<<$DELIMITER" >> $GITHUB_ENV
        cat active_rules.md >> $GITHUB_ENV
        echo "" >> $GITHUB_ENV 
        echo "$DELIMITER" >> $GITHUB_ENV
        echo "DEBUG: PR_REVIEWER__EXTRA_INSTRUCTIONS content:"
        cat active_rules.md

        # PR_CODE_SUGGESTIONS için kuralları env'e yaz
        echo "PR_CODE_SUGGESTIONS__EXTRA_INSTRUCTIONS<<$DELIMITER" >> $GITHUB_ENV
        cat active_rules.md >> $GITHUB_ENV
        echo "" >> $GITHUB_ENV 
        echo "$DELIMITER" >> $GITHUB_ENV

    - name: Debug Rules
      shell: bash
      run: |
        echo "🔍 ENJECTE EDİLEN KURALLAR (RAW VIEW):"
        cat active_rules.md
